project_id = "furohpfhukwajhvnnbiw"

# ---------------------------------------------------------------------------
# Edge Functions
#
# SEMPRE declarar verify_jwt aqui, mesmo quando o valor for o padrão. Sem a
# entrada, o deploy pode trocar a autenticação da função em silêncio.
# ---------------------------------------------------------------------------

# Um passo da carga do OEM. Chamada pelo pg_cron com a chave service_role.
[functions.oem-sync-passo]
verify_jwt = true

# Porta de saida para o DoctorSaaS. Autentica por chave de integracao
# (x-api-key, comparada por SHA-256), nao por JWT — quem chama e outro
# sistema. Por isso verify_jwt = false: a chave E a autenticacao.
[functions.oem-exportar]
verify_jwt = false

# Diagnostico de UMA filial: devolve as respostas cruas das duas APIs do OEM.
# Leitura pura, nao escreve em lugar nenhum. Mesma autenticacao da exportar
# (x-api-key), pelo mesmo motivo: quem chama e outro sistema.
[functions.oem-diagnostico-filial]
verify_jwt = false

# Baixa de modulo numa licenca. Escreve no OEM (le a filial, troca o modulo e
# grava de volta), com guarda: nao envia nada se a leitura nao trouxer os
# campos obrigatorios. Mesma autenticacao por x-api-key das outras — quem
# chama e o DoctorSaaS, nao uma pessoa logada aqui.
[functions.oem-licenca-modulo]
verify_jwt = false
